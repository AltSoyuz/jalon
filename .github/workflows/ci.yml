name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the whole suite without pushing, for an infrastructure failure or a
  # dependency of the runner image that moved under us.
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

# Every setup-go step passes cache: false. The module has no dependency, so
# there is no go.sum, and left on the cache warns about a missing dependencies
# file in every job.

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    # Windows is built by the crosscompile job but not tested here: the suite
    # shells out to /bin/sh to stub `gh`, and making it portable would be work
    # for a platform nobody has reported using yet.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from go.mod, so bumping Go is one line in one file.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: gofmt
        run: make fmt
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # jalon runs against its own .tasks/: a format change that breaks real
      # files fails here before it reaches anyone.
      - name: run jalon on this repository
        run: make dogfood

  crosscompile:
    name: crosscompile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # The release matrix is built on every pull request, so a platform
      # specific break is caught before the tag, not during it.
      - name: build every published platform
        run: make release VERSION=ci

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: staticcheck
        run: staticcheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary rather than the action. The action exited 1 on a scan that
      # reported "no leaks found", and an opaque exit code is a poor fit for the
      # one job whose entire purpose is trust. The price is that dependabot no
      # longer bumps it: GITLEAKS_VERSION above is now bumped by hand.
      - name: install gitleaks
        run: |
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: scan the whole history
        run: ./gitleaks git . --redact --no-banner
